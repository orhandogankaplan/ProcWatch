name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller

      - name: Run tests
        run: pytest -v

      - name: Build Windows windowed onedir bundle (no blank cmd window)
        run: |
          pyinstaller --onedir --windowed --name procwatch src/procwatch/cli.py
          Copy-Item README.md dist/procwatch/README.md

      - name: Package zip and generate SHA-256 checksum
        shell: pwsh
        run: |
          Compress-Archive -Path dist/procwatch/* -DestinationPath ProcWatch-windows-x64.zip -Force
          $hash = (Get-FileHash ProcWatch-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  ProcWatch-windows-x64.zip" | Out-File -Encoding ascii SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" ProcWatch-windows-x64.zip SHA256SUMS.txt --title "ProcWatch ${{ github.ref_name }}" --generate-notes
